<div class="splitter" id="splitter" role="separator" aria-label="Larghezza chat" aria-orientation="vertical" aria-valuemin="310" aria-valuemax="600" aria-valuenow="390" tabindex="0"></div>
<aside class="sidechat" id="sidechat" aria-label="Chat del cantiere">
  <header class="chat-toolbar"><button class="conversation-title" id="conversation-title" onclick="showHistory()">Tracciabilità di HEB 180 <span>⌄</span></button><button class="icon-button" onclick="newConversation()" aria-label="Nuova conversazione">＋</button><button class="icon-button" onclick="showHistory()" aria-label="Cronologia">↶</button><button class="icon-button" onclick="toggleChat()" aria-label="Chiudi chat">×</button></header>
  <div class="chat-scope"><span></span><span id="chat-scope-name">Cantiere dimostrativo</span> · 12 documenti</div>
  <div class="history-popover hidden" id="history"><div class="popover-label">CONVERSAZIONI LOCALI DELLA DEMO</div><div id="history-list"></div></div>
  <div class="conversation" id="conversation" role="log" aria-live="polite" aria-label="Messaggi"></div>
  <div class="composer-area">
    <div class="suggestions"><button onclick="ask('Quali documenti mancano?')">Cosa manca?</button><button onclick="ask('Quali voci sono da confermare?')">Da confermare</button></div>
    <div class="composer-card">
      <div class="context-chips" id="context-chips"></div>
      <label class="sr-only" for="question">Domanda sul cantiere</label><textarea id="question" placeholder="Chiedi qualcosa sul cantiere. Usa @ per una fonte…" rows="2" maxlength="2000"></textarea>
      <div class="composer-footer"><button class="icon-button" onclick="pickContext()" aria-label="Aggiungi fonte al contesto">＋</button><div class="sp"></div><button class="send-button" id="send-question" onclick="ask()" aria-label="Invia domanda">↑</button></div>
    </div>
    <div class="agent-toolbar"><button class="agent-icon" onclick="openSettings('account')" aria-label="Account e agente">◎</button><label class="sr-only" for="model">Modello</label><select id="model" onchange="updateModel(this.value)"><option value="auto">Automatico</option><option value="demo">Modello demo</option></select><label class="sr-only" for="effort">Ragionamento</label><select id="effort" onchange="updateEffort(this.value)"><option value="low">Basso</option><option value="medium">Medio</option><option value="high">Alto</option></select><div class="sp"></div><button class="icon-button" onclick="openSettings('models')" aria-label="Impostazioni modello">⚙</button></div>
    <div class="demo-caption">Risposte simulate · nessun account collegato · nessun consumo</div>
  </div>
</aside></div>
<dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><div class="settings-header"><h2 id="settings-title">Impostazioni</h2><span class="pill n">Demo</span><div class="sp"></div><button class="icon-button" onclick="closeSettings()" aria-label="Chiudi impostazioni">×</button></div><div class="settings-layout"><nav class="settings-nav" aria-label="Sezioni impostazioni"><label class="sr-only" for="settings-search">Cerca impostazioni</label><input id="settings-search" type="search" placeholder="Cerca impostazioni…" oninput="filterSettings(this.value)"><button data-section="general" onclick="settingsSection('general')"><span>◐</span>Generali</button><button data-section="account" onclick="settingsSection('account')"><span>◎</span>Account e agente</button><button data-section="models" onclick="settingsSection('models')"><span>✧</span>Modelli</button><button data-section="storage" onclick="settingsSection('storage')"><svg class="ic"><use href="#fold"/></svg>Documenti e dati</button><button data-section="shortcuts" onclick="settingsSection('shortcuts')"><span>⌘</span>Scorciatoie</button><button data-section="diagnostics" onclick="settingsSection('diagnostics')"><span>⌁</span>Diagnostica</button><div class="settings-nav-foot">Tracciabilità materiali<br><span>Anteprima per macOS e Windows</span></div></nav><section id="settings-content" class="settings-content"></section></div><footer class="settings-foot">Queste impostazioni riguardano solo la demo.<div class="sp"></div><button class="text-button" onclick="closeSettings()">Fine</button></footer></dialog>
<dialog id="document-dialog" class="document-dialog" aria-labelledby="document-title"><header class="settings-header"><h2 id="document-title">Documento</h2><div class="sp"></div><button class="btn s" onclick="attachCurrentDocument()">Porta in chat</button><button class="icon-button" onclick="document.getElementById('document-dialog').close()" aria-label="Chiudi documento">×</button></header><div id="document-content" class="document-content"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
