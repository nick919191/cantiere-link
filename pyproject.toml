[project]
name = "tracciabilita-materiali"
version = "0.4.0"
license = "MIT"
description = "CantiereLink: materiali, documenti e tracciabilità del cantiere"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "openpyxl>=3.1",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "keyring>=25,<26",
    "filelock>=3.16,<4",
]

[project.optional-dependencies]
sviluppo = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
